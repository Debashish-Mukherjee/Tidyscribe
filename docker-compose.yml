services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docworkbench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docworkbench"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      additional_contexts:
        certs: ./certificates
    environment: &app-environment
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/docworkbench
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      SENTRY_DSN: ${SENTRY_DSN:-}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      EXPORT_RETENTION_HOURS: ${EXPORT_RETENTION_HOURS:-168}
      EXPORT_SOFT_TIMEOUT_SECONDS: ${EXPORT_SOFT_TIMEOUT_SECONDS:-90}
      EXPORT_HARD_TIMEOUT_SECONDS: ${EXPORT_HARD_TIMEOUT_SECONDS:-120}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/data/uploads
      - exports_data:/app/data/exports
      - previews_data:/app/data/previews
      - diagrams_data:/app/data/diagrams
      - templates_data:/app/data/templates
      - generated_data:/app/data/generated

  worker: &export-worker
    build:
      context: ./backend
      args:
        INSTALL_DOC_TOOLS: ${INSTALL_DOC_TOOLS:-false}
      additional_contexts:
        certs: ./certificates
    command: celery -A app.tasks worker --loglevel=info --concurrency=2 -Q celery
    environment:
      <<: *app-environment
      EXPORT_ENGINE: ${EXPORT_ENGINE:-python}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/docworkbench
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/data/uploads
      - exports_data:/app/data/exports
      - previews_data:/app/data/previews
      - diagrams_data:/app/data/diagrams
      - templates_data:/app/data/templates
      - generated_data:/app/data/generated

  maintenance:
    <<: *export-worker
    command: celery -A app.tasks worker --loglevel=info --concurrency=1 -Q maintenance
    environment:
      <<: *app-environment
      WORKER_ROLE: maintenance
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/docworkbench
      REDIS_URL: redis://redis:6379/0

  scheduler:
    <<: *export-worker
    command: celery -A app.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        # Inlined into the browser bundle at build time; rebuild the image to change it.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      additional_contexts:
        certs: ./certificates
    environment:
      # Read at container start; must be the URL the browser uses to reach the API.
      API_URL: ${API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  exports_data:
  previews_data:
  diagrams_data:
  templates_data:
  generated_data:
